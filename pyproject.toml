[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["accounts", "tickets", "config"]
omit = [
    "*/migrations/*",
    "config/asgi.py",
    "config/wsgi.py",
    "config/test_settings.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["accounts", "tickets", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/test_settings.py" = ["F403"]
"config/settings.py" = ["E402"]
"**/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "tickets"]
